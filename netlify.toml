# ═══════════════════════════════════════════════
# NEXUS PUPPY FLOW — Netlify Configuration
# ═══════════════════════════════════════════════

[build]
  publish = "."

# ─── Site ID (for deploy script to work from any clone) ───
[site]
  id = "fanciful-panda-d32cde"

# ─── Headers ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker needs broad scope
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# ─── Redirects ───
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
